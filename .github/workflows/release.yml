name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ai-assistant.spec --clean

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ai-desktop-assistant -DestinationPath ai-desktop-assistant-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-desktop-assistant-windows
          path: ai-desktop-assistant-windows.zip
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-desktop-assistant-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl binutils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ai-assistant.spec --clean

      - name: Package tar.gz
        run: |
          tar -czf ai-desktop-assistant-linux.tar.gz -C dist ai-desktop-assistant

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-desktop-assistant-linux
          path: ai-desktop-assistant-linux.tar.gz
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-desktop-assistant-linux.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
