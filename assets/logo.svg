<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="102" fill="#2563EB"/>
  <!-- Stylized "A" letter with AI neural nodes -->
  <!-- Left leg -->
  <line x1="120" y1="380" x2="256" y2="100" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="256" y1="100" x2="392" y2="380" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="178" y1="260" x2="334" y2="260" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- AI nodes and connections -->
  <circle cx="256" cy="100" r="22" fill="white"/>
  <circle cx="120" cy="380" r="18" fill="white"/>
  <circle cx="392" cy="380" r="18" fill="white"/>
  <circle cx="178" cy="260" r="14" fill="white"/>
  <circle cx="334" cy="260" r="14" fill="white"/>
  <!-- Connection dots at apex -->
  <circle cx="256" cy="60" r="10" fill="white" opacity="0.6"/>
  <circle cx="210" cy="180" r="8" fill="white" opacity="0.5"/>
  <circle cx="302" cy="180" r="8" fill="white" opacity="0.5"/>
</svg>
